<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud de Estudantes</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="cabecalho">
        <header>
            <h1>Gestão de Estudantes</h1>
            <p>Cadastro e controlo das notas dos estudantes</p>
        </header>
        <section class="form-section">
            <h2>Dados do Estudante</h2>
            <form id="formEstudante">
                <div class="form-group">
                    <div class="input-box">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" placeholder="EX: EST001">
                    </div>
                    <div class="input-box">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" placeholder="Digite o nome do estudante">
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-box">
                        <label for="teste1">Teste 1</label>
                        <input type="number" id="teste1" placeholder="0 - 20" min="0" max="20">
                    </div>
                    <div class="input-box">
                        <label for="teste2">Teste 2</label>
                        <input type="number" id="teste2" placeholder="0 - 20" min="0" max="20">
                    </div>
                    <div class="input-box">
                        <label for="teste3">Teste 3</label>
                        <input type="number" id="teste3" placeholder="0 - 20" min="0"max="20">
                    </div>
                </div>
                <div class="media-box">
                    <span>Média</span>
                    <strong id="media">
                        0.00
                    </strong>
                </div>
                <div class="buttons">
                    <button type="submit" id="btnAdicionar">
                        Adicionar estudante
                    </button>
                    <button type="button" id="btnActualizar">
                        Actualizar estudante
                    </button>
                    <button type="button" id="btnRemover">
                        Remover estudante
                    </button>
                    <button type="button" id="btnEliminar">
                        Eliminar estudante
                    </button>
                </div>
            </form>
        </section>
        <section class="table-section">
            <div class="table-header">
                <div>
                    <h2>Lista de Estudantes</h2>
                    <p>Estudantes cadastrados no sistema</p>
                </div>
                <span id="totalEstudantes">
                    Total: 0
                </span>

            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Teste 1</th>
                            <th>Teste 2</th>
                            <th>Teste 3</th>
                            <th>Média</th>
                            <th>Estado</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaEstudantes">

                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
